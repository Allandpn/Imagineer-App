name: Release

# Ao receber um push de tag "v*", compila o APK de release assinado e cria a Release no GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar a keystore
        run: echo "${{ secrets.IMAGINEER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/imagineer.jks"

      - name: Compilar o APK assinado
        run: >
          ./gradlew assembleRelease
          -PIMAGINEER_KEYSTORE_ARQUIVO="$RUNNER_TEMP/imagineer.jks"
          -PIMAGINEER_KEYSTORE_ALIAS="${{ secrets.IMAGINEER_KEYSTORE_ALIAS }}"
          -PIMAGINEER_KEYSTORE_SENHA="${{ secrets.IMAGINEER_KEYSTORE_SENHA }}"

      - name: Criar a Release com um único APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "imagineer-${VERSAO}.apk"
          sha256sum "imagineer-${VERSAO}.apk"
          gh release create "$GITHUB_REF_NAME" "imagineer-${VERSAO}.apk" \
            --title "Imagineer ${VERSAO}" --notes "Imagineer ${VERSAO}: APK de release assinado."
